# apps/slm-server/nginx/nginx.conf
#
# Reverse proxy in front of the FastAPI SLM Server (slm-server:8000).
# Two things this MUST get right, both of which the default Nginx config
# gets wrong for this workload:
#
#   1. /v1/chat/stream is Server-Sent Events (text/event-stream).
#      Nginx buffers proxied responses by default — it will silently hold
#      the entire SSE stream until the upstream closes the connection
#      before sending anything to the client, defeating streaming entirely.
#      proxy_buffering off fixes this.
#   2. Connection/request-count handling for 10k+ held-open SSE/queue
#      connections needs real worker_connections and file-descriptor
#      headroom.

user  nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    types_hash_max_size 2048;

    log_format main '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─────────────────────────────────────────────────────────────
    # FIRST-LINE, COARSE rate/connection limiting.
    # Absorbs network-level abuse BEFORE it reaches the app.
    # ─────────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=ssense_req:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=ssense_conn:10m;

    # SOTA FIX: Aligned with docker-compose.yml service name and port
    upstream slm_server {
        server slm-server:8000;
        keepalive 64;
    }

    # ─────────────────────────────────────────────────────────────
    # HTTP → HTTPS redirect
    # ─────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        location = /nginx-health {
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # ssl_certificate     /etc/nginx/certs/ssense.crt;
        # ssl_certificate_key /etc/nginx/certs/ssense.key;
        
        # TEMPORARY FALLBACK: Use self-signed or remove SSL requirement for local docker testing
        # Uncomment the above two lines when injecting real certs.
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        limit_req zone=ssense_req burst=40 nodelay;
        limit_conn ssense_conn 200;

        # 120k characters is ~120KB. 1MB limit gives plenty of headroom.
        client_max_body_size 1m; 

        # ── Chatbot SSE Streaming Endpoint ──
        location = /v1/chat/stream {
            proxy_pass http://slm_server;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SOTA FIX: Disable buffering exclusively for the SSE stream
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Margin for slow generations
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Everything else (including /v1/audit JSON endpoint) ──
        location / {
            proxy_pass http://slm_server;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Gzip is highly effective for the massive JSON blocks returned by the Auditor
            gzip on;
            gzip_types application/json;
            
            # Auditor can take up to 35 seconds to generate the massive JSON tree
            proxy_read_timeout 90s;
        }

        # Lightweight health check
        location = /health {
            proxy_pass http://slm_server/health;
            access_log off;
        }
    }
}