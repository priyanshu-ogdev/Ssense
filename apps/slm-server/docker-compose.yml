version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────
  # 1. UNIFIED SLM INFERENCE & RAG SERVER (FastAPI + Async vLLM)
  # ─────────────────────────────────────────────────────────────
  slm-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssense-slm-server
    restart: unless-stopped
    
    # SOTA FIX: Shared memory is absolutely critical for vLLM/PyTorch tensor operations.
    # Default Docker shm_size is 64MB, which causes vLLM to instantly "Bus error (core dumped)".
    shm_size: '8gb'
    
    # Internal network only: Nginx proxies public traffic to port 8000
    expose:
      - "8000"
      
    env_file:
      - .env
      
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - VLLM_WORKER_MULTIPROCESS_METHOD=spawn
      - RAY_DISABLE_MEMORY_MONITOR=1
      # Fallbacks in case .env is missing/incomplete
      - SSENSE_SERVER_KEY=${SSENSE_SERVER_KEY:-ssense_prod_secret_token_2026}
      - SSENSE_MAX_QUEUE_DEPTH=${SSENSE_MAX_QUEUE_DEPTH:-5000}
      - MODELS_DIR=/app/models
      
    volumes:
      # Read-only mounts for certified model weights, adapters, and RAG index
      - ../../ml/models:/app/models:ro
      - ../../libs/contracts/schemas:/app/schemas:ro
      # HuggingFace cache mount prevents redownloading base weights across container restarts
      - ~/.cache/huggingface:/root/.cache/huggingface
      
    deploy:
      # SOTA FIX: Modern Docker GPU Passthrough (Replaces deprecated 'runtime: nvidia')
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
              
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ─────────────────────────────────────────────────────────────
  # 2. EDGE GATEWAY REVERSE PROXY (TLS Termination & Non-Buffered SSE)
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ssense-nginx-proxy
    restart: unless-stopped
    depends_on:
      slm-server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s