[package]
name = "ssense-native-daemon"
version = "3.0.0"
edition = "2021"
authors = ["Ssense Engineering <admin@ssense.local>"]
description = "SOTA Zero-Hop Native Messaging Daemon for DPDP Edge Inference"

[dependencies]
# 1. Async Runtime & Native Messaging IO
tokio = { version = "1.38", features = ["full", "fs"] }
futures-util = "0.3"

# 2. Chrome IPC & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5" # Crucial for 32-bit Chrome messaging prefixes

# 3. Telemetry & OS Paths
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2" # Non-blocking file logging
thiserror = "1.0"
anyhow = "1.0"
directories = "5.0"

# 4. Local Caching & Hardware State
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
sysinfo = "0.30" # Hardware profiling for VRAM Airlock

# 5. Model Sync (Direct HTTP Auto-Downloader)
# NOTE: hf-hub was previously listed here but is never imported anywhere in
# src/ (model_manager.rs downloads GGUF files with plain reqwest). It pulled
# in its own tokenizers/native-tls stack for zero benefit and was a common
# source of unrelated build breakage, so it has been removed.
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }

# 6. SOTA Edge ML & RAG Engines
llama-cpp-2 = "0.1.154"  # The modern, active Rust binding for GGUF/llama.cpp
                          # Builds llama.cpp from source via `cmake` — requires
                          # `cmake` + a C/C++ toolchain on PATH. This is a system
                          # prerequisite, not something fixable from Cargo.toml.
                          # Debian/Ubuntu: apt install -y cmake build-essential
                          # macOS:         xcode-select --install
                          # Windows:       Visual Studio "Desktop C++" workload

# fastembed wraps `ort` (ONNX Runtime). Pinned to 5.x (not the old 3.2, which
# resolved to a stale ort release with dead binary-download URLs — the exact
# "ort"/build error this used to throw) and locked to `default-features =
# false` with an explicit feature list so it NEVER tries the `system` ORT
# strategy (which needs onnxruntime pre-installed and correctly on your
# linker path) or native-tls (which needs OpenSSL headers). Instead:
#   - ort-download-binaries -> ort fetches a prebuilt ONNX Runtime archive
#     for your OS/arch at build time and links against that. No local ONNX
#     Runtime install, no cmake step for this crate.
#   - hf-hub-rustls-tls      -> same rustls stack as reqwest above, so no
#     OpenSSL / native-tls dependency anywhere in the tree.
fastembed = { version = "5", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries"] }
safetensors = "0.4"
memmap2 = "0.9"          # Forces OS to page vectors to SSD
rayon = "1.10"           # CPU SIMD parallelization for vector math
bytemuck = "1.15"        # Zero-copy raw pointer casting for memory mapped tensors
sha2 = "0.10"             # SHA-256 integrity verification for downloaded model artifacts
hex = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true