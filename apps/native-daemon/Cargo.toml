[package]
name = "ssense-native-daemon"
version = "3.0.0"
edition = "2021"
authors = ["Ssense Engineering <admin@ssense.local>"]
description = "SOTA Zero-Hop Native Messaging Daemon for DPDP Edge Inference"

[features]
default = []
# Enable to build llama-cpp-2 with NVIDIA CUDA acceleration.
# Named "cublas" locally (matches the cfg!(feature = "cublas") checks in src/inference/)
# even though the upstream llama-cpp-2 crate's own feature is called "cuda".
cublas = ["llama-cpp-2/cuda"]
# Enable to build llama-cpp-2 with Apple Metal acceleration (macOS only).
metal = ["llama-cpp-2/metal"]

[dependencies]
# 1. Async Runtime & Native Messaging IO
tokio = { version = "1.38", features = ["full", "fs"] }
futures-util = "0.3"

# 2. Chrome IPC & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5" # Crucial for 32-bit Chrome messaging prefixes

# 3. Telemetry & OS Paths
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2" # Non-blocking file logging
thiserror = "1.0"
anyhow = "1.0"
directories = "5.0"

# 4. Local Caching & Hardware State
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
sysinfo = "0.30" # Hardware profiling for VRAM Airlock

# 5. Model Sync (HuggingFace Auto-Downloader)
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
hf-hub = { version = "0.3.2", features = ["tokio"] }

# 6. SOTA Edge ML & RAG Engines
llama-cpp-2 = "=0.1.86"  # Pinned: code uses the pre-rewrite candidates/grammar sampling API
llama-cpp-sys-2 = "=0.1.86"  # MUST match llama-cpp-2's version exactly (old model-based vocab API, not the newer llama_vocab split)
fastembed = "5"          # Updated: 3.2 was incompatible with ort 2.0-rc; v5 matches our pinned ort/ndarray versions
ort = { version = "2.0.0-rc.13", default-features = false, features = ["download-binaries", "tls-rustls"] } # Pin TLS backend to fix ort-sys build error
ndarray = { version = "0.17", features = ["std"] } # Fix: ort needs ndarray's std feature (NdFloat) enabled explicitly
safetensors = "0.4"
memmap2 = "0.9"          # Forces OS to page vectors to SSD
rayon = "1.10"           # CPU SIMD parallelization for vector math
bytemuck = "1.15"        # Zero-copy raw pointer casting for memory mapped tensors
sha2 = "0.10"             # SHA-256 integrity verification for downloaded model artifacts
hex = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true